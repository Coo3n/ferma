    <!-- Первый кадр не показываем, пока app.js не выберет раздел по адресу:
         в разметке «Ферма» выбрана по умолчанию, и при обновлении на другой
         вкладке подсветка было видно, как она перескакивает. Страховка — если
         скрипты не загрузились, через 2 с страница всё равно появится. -->
    <style>
        html.boot body { visibility: hidden }
        /* Первые ~секунда: всё, что рисуется при загрузке (скелет, плитки,
           заглушки, смена раздела), встаёт сразу в конечное положение, а не
           играет входные анимации одна поверх другой — на обновлении они
           дёргались. Длительность 0, а не animation:none: так конец
           анимации достигнут и она не стартует заново, когда класс снимется. */
        html.nofx *, html.nofx *::before, html.nofx *::after {
            animation-duration: 0s !important;
            animation-delay: 0s !important;
            transition-duration: 0s !important;
            transition-delay: 0s !important;
        }
    </style>
    <script>
        document.documentElement.classList.add('boot', 'nofx');
        setTimeout(function () { document.documentElement.classList.remove('boot'); }, 2000);
        setTimeout(function () { document.documentElement.classList.remove('nofx'); }, 1200);
    </script>
</head>
<body>
<!-- Спрайт иконок (icons.svg) вклеивается сюда до первой отрисовки:
     внешний SVG через <use href="file#id"> не наследует currentColor, и
     иконки перестали бы краситься темой. Синхронно — чтобы не мигали. -->
<script>
    (function () {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'icons.svg', false);
            xhr.send();
            if (xhr.status === 200) document.write(xhr.responseText);
        } catch (e) { /* без иконок, но рабочий */ }
    })();
</script>

<a class="skip" href="#main" data-t="common.k_osnovnomu_soderzhimomu">К основному содержимому</a>

                      stroke-linecap="round"/>
                <path d="m8.2 5.2 1 1.6M15.8 5.2l-1 1.6" stroke="currentColor" stroke-width="1.6"
                      stroke-linecap="round"/>
                <rect x="3.5" y="10" width="2.4" height="6" rx="1.2" fill="currentColor"/>
                <rect x="18.1" y="10" width="2.4" height="6" rx="1.2" fill="currentColor"/>
            </svg>
        </span>
        <span class="wm">Android&nbsp;Farm</span>

    <nav class="nav" aria-label="Разделы" data-t-aria-label="nav.razdely">

            <svg class="ic" aria-hidden="true">
                <use href="#i-grid"/>
            </svg>
            Ферма
        </button>
        <button class="navbtn" data-view="scen" onclick="showView('scen')" data-t="nav.stsenarii">
            <svg class="ic" aria-hidden="true">

            </svg>
            Сценарии

        <button class="navbtn" data-view="jobs" onclick="showView('jobs')" data-t="nav.zapuski">

            </svg>
            Запуски

            <span class="badge b-failed" id="navDeviations" hidden

        </button>
        <button class="navbtn" data-view="accounts" onclick="showView('accounts')" data-t="nav.akkaunty">

            </svg>

        </button>
    </nav>

    <span class="sp"></span>

    <!-- Открытое устройство — это контекст, а не четвёртый раздел: в него
         заходят из фермы, а не переключаются как между разделами. Поэтому оно
         стоит вне навигации и показывает, что именно открыто и как это
         закрыть. Раньше кнопка висела среди разделов и сбивала с толку. -->
    <span class="ctx" id="navDevice" hidden>
        <button class="ctx-go" data-view="device" onclick="showView('device')"
                title="Вернуться к телефону" data-t-title="nav.vernutsya_k_telefonu">
            <svg class="ic" aria-hidden="true">
                <use href="#i-phone"/>
            </svg>
            <span id="navDeviceName" data-t="nav.telefon">Телефон</span>
        </button>
        <button class="ctx-x" onclick="closeDevice()"
                title="Закрыть телефон" aria-label="Закрыть телефон" data-t-title="nav.zakryt_telefon" data-t-aria-label="nav.zakryt_telefon">
            <svg class="ic" aria-hidden="true">
                <use href="#i-x"/>
            </svg>
        </button>
    </span>

    <span class="stat" id="stStatus" data-t="nav.podklyuchenie">подключение…</span>
    <span class="stat" id="stJobs"></span>
    <button class="sm icon" onclick="restartAdb(event)" aria-label="Переподключить телефоны"
            title="Если телефон пропал или завис" data-t-title="nav.esli_telefon_propal_ili" data-t-aria-label="nav.perepodklyuchit_telefony">
        <svg class="ic" aria-hidden="true">
            <use href="#i-refresh"/>
        </svg>
    </button>
</header>

<main id="main">

    <!-- ============================================================ ФЕРМА -->
    <section class="view loading" id="view-fleet" aria-label="Все телефоны" data-t-aria-label="fleet.vse_telefony">
        <div class="bar">
            <div class="find">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-search"/>
                </svg>
                <input type="text" id="devSearch" placeholder="имя или номер телефона"
                       aria-label="Поиск по телефонам"
                       oninput="filterDevices(this.value)"
                       onkeydown="if(event.key==='Escape'){this.value='';filterDevices('')}" data-t-placeholder="fleet.imya_ili_nomer_telefona" data-t-aria-label="fleet.poisk_po_telefonam">
            </div>

            <!-- Фильтр по состоянию — это карточки обзора ниже; отдельные
                 чипы повторяли их один в один. Здесь — только группа. -->
            <select id="groupFilter" class="sm" aria-label="Группа" hidden
                    onchange="setGroupFilter(this.value)" data-t-aria-label="fleet.gruppa"></select>
            <select id="tagFilter" class="sm" aria-label="Тег" hidden
                    onchange="setTagFilter(this.value)" data-t-aria-label="fleet.teg"></select>

            <button class="sm" id="groupRunBtn" hidden onclick="openRunDialog({mode: 'groups'})"
                    title="Каждой группе — свой сценарий, одним запуском" data-t="fleet.po_gruppam" data-t-title="fleet.kazhdoy_gruppe_svoy_stsenariy">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-play"/>
                </svg>
                По группам
            </button>
            <div class="seg" role="group" aria-label="Размер плиток" data-t-aria-label="fleet.razmer_plitok">
                <button class="sm" data-density-btn="l" onclick="setDensity('l')" title="Крупно — видно экран" data-t-title="fleet.krupno_vidno_ekran">L</button>
                <button class="sm" data-density-btn="m" onclick="setDensity('m')" title="Средне" data-t-title="fleet.sredne">M</button>
                <button class="sm" data-density-btn="s" onclick="setDensity('s')" title="Мелко — 40+ телефонов на одном экране" data-t-title="fleet.melko_40_telefonov_na">S</button>
            </div>

            <span class="sp"></span>

            <button class="sm" onclick="selectAll(!S.selected.size)">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-check-square"/>
                </svg>
                <span id="selAllLabel" data-t="fleet.vybrat_vse">Выбрать все</span>
            </button>
        </div>

        <div class="scroll grow" id="fleetScroll">
            <!-- Обзор: четыре числа, которые спрашивают первыми. Каждая
                 карточка — это же и фильтр, поэтому она кнопка. -->
            <div class="kpis" id="fleetStats" role="group" aria-label="Обзор фермы" data-t-aria-label="fleet.obzor_fermy"></div>

            <div class="sect">
                <h2 data-t="fleet.telefony">Телефоны</h2>
                <span class="sect-n tnum" id="fleetShown"></span>
                <!-- Подсказки «клик по карточке — открыть рабочее место»
                     здесь нет намеренно: карточка сама показывает «Открыть»
                     при наведении (см. .tile .open) и ведёт себя как кнопка.
                     Постоянная строка повторяла то, что уже сказано в самом
                     месте действия, и висела насовсем — научив однажды,
                     дальше работала шумом. -->
            </div>

            <div class="tiles" id="fleet"></div>
            <div class="hiddenzone" id="fleetHidden"></div>
        </div>

        <!-- Панель запуска: появляется, только когда что-то выбрано. -->
        <div class="runbar" id="runbar" hidden>
            <span class="count" id="runCount"></span>
            <span class="sp"></span>
            <button class="sm" onclick="selectAll(false)" data-t="fleet.otmena">Отмена</button>
            <button id="runSync" onclick="startSync()" title="Клик на одном телефоне — повтор на всех выбранных" data-t="fleet.sinhronno" data-t-title="fleet.klik_na_odnom_telefone">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-crosshair"/>
                </svg>
                Синхронно
            </button>
            <button onclick="bulkMenu()" title="Установка, файлы, текст, перезагрузка, группы, теги" data-t="fleet.deystviya" data-t-title="fleet.ustanovka_fayly_tekst_perezagruzka">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-layers"/>
                </svg>
                Действия
            </button>
            <button class="primary" onclick="openRunDialog()" data-t="fleet.zapustit_stsenariy">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-play"/>
                </svg>
                Запустить сценарий
            </button>
        </div>
    </section>

    <!-- ======================================================= УСТРОЙСТВО -->
    <!-- Рабочее место — конструктор сценария, а не набор вкладок с
         инструментами. Граф занимает всю площадь, зеркало экрана стоит
         сбоку узкой колонкой и сворачивается: смотреть на телефон нужно
         в момент клика по нему, строить сюжет — всё остальное время.
         Разовые команды (запуск пакета, ссылка, adb shell, дампы) живут в
         диалоге «Управление» — они нужны раз в сессию и не стоят
         постоянного места на экране. -->
    <section class="view" id="view-device" aria-label="Рабочее место телефона" data-t-aria-label="device.rabochee_mesto_telefona">
        <!-- Отдельной панели устройства здесь больше нет. Она несла пять
             элементов, из которых четыре нашли себе место получше:
             «пауза»/«В окне» — в шапку зеркала (управляют трансляцией),
             «Починить» и заряд с температурой — в диалог «Управление»
             (чинят раз в день, а заряд виден на плитке фермы). Остались
             крошка «← Ферма / имя» и вход в «Управление» — они встали в
             первый ряд конструктора, и строка над рабочим местом ушла. -->
        <div class="work" id="work">
            <!-- конструктор сценария -->
            <div class="col build">
                <div class="recbar">
                    <div class="recbar-row">
                        <!-- Крошка: откуда пришли и где мы. Заряд, температура
                             и версия Android ушли в подсказку — на виду они
                             дублировали плитку фермы, а строку занимали. -->
                        <button class="sm ghost crumb" onclick="showView('fleet')"
                                title="Вернуться к ферме"
                                aria-label="Вернуться к ферме" data-t-title="device.vernutsya_k_ferme" data-t-aria-label="device.vernutsya_k_ferme">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-back"/>
                            </svg>
                            <span data-t="device.ferma">Ферма</span>
                        </button>
                        <strong class="crumb-name" id="scrTitle" data-t="device.ekran">Экран</strong>
                        <button class="sm ghost" id="btnToPult" onclick="pultBack()"
                                title="Вернуться к пульту телефона" aria-label="К пульту" data-t-title="device.vernutsya_k_pultu_telefona" data-t-aria-label="device.k_pultu">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-grid"/>
                            </svg>
                        </button>

                        <span class="recbar-sep" aria-hidden="true"></span>

                        <button class="sm" id="btnRecStart" onclick="recStart()" data-t="device.zapis">
                            <svg class="ic dotrec" aria-hidden="true">
                                <use href="#i-record"/>
                            </svg>
                            Запись
                        </button>
                        <button class="sm" id="btnRecPause" onclick="recPause()" disabled title="Пауза записи" data-t="device.pauza" data-t-title="device.pauza_zapisi">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-pause"/>
                            </svg>
                            Пауза
                        </button>
                        <!-- hidden по умолчанию: в покое чип молчит (см.
                             recSync), а показать его до первого recSync
                             значит мигнуть «не записывается» на загрузке. -->
                        <span class="stat sm" id="recState" hidden data-t="device.ne_zapisyvaetsya">не записывается</span>


                        <span class="sp"></span>

                        <button class="sm" id="btnRecRun" onclick="recRunOpen()"
                                title="Прогнать на этом телефоне" data-t="device.proverit" data-t-title="device.prognat_na_etom_telefone">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-play"/>
                            </svg>
                            Проверить
                        </button>
                        <button class="sm" id="btnRecModeOff" onclick="recModeOff()"
                                title="Выйти из обучения, не сохраняя автозакрытие" hidden data-t-title="device.vyyti_iz_obucheniya_ne">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-undo"/>
                            </svg>
                            <span data-t="device.ne_uchit">Не учить</span>
                        </button>
                        <button class="primary sm" id="btnRecSave" onclick="recSaveForm()">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-save"/>
                            </svg>
                            <span data-t="device.sohranit_stsenariy">Сохранить сценарий</span>
                        </button>
                    </div>

                    <div class="recbar-row sub">
                        <!-- Второй ряд — только то, что жмут при правке:
                             добавить шаг и отмена. Проверка экрана, развилка,
                             код, изменения и настройки записи нужны редко и
                             ушли в «Ещё»: двадцать кнопок в два ряда читались
                             как приборная панель, а не как редактор. -->
                        <button class="sm" onclick="recLibOpen()"
                                title="Добавить шаг вручную" data-t-title="device.dobavit_shag_vruchnuyu">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-plus"/>
                            </svg>
                            <span data-t="device.dobavit_shag">Добавить шаг</span>
                        </button>
                        <button class="sm ghost" id="btnRecUndo" onclick="recUndo()"
                                title="Отменить (Ctrl/⌘+Z)" aria-label="Отменить" disabled data-t-title="device.otmenit_ctrl_z" data-t-aria-label="device.otmenit">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-undo"/>
                            </svg>
                        </button>
                        <button class="sm ghost" id="btnRecRedo" onclick="recRedo()"
                                title="Вернуть (Ctrl/⌘+Y или Ctrl/⌘+Shift+Z)" aria-label="Вернуть" disabled data-t-title="device.vernut_ctrl_y_ili" data-t-aria-label="device.vernut">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-redo"/>
                            </svg>
                        </button>
                        <details class="recmore" id="recMore">
                            <summary class="btn sm ghost" data-t="device.esche">Ещё</summary>
                            <div class="recmore-pop" onclick="if(event.target.closest('button'))$('recMore').open=false">
                                <button class="sm ghost" id="btnRecBranch" onclick="recBranchHere()"
                                        title="Если на экране то-то — выполнить блок" data-t-title="device.esli_na_ekrane_to">
                                    <svg class="ic" aria-hidden="true">
                                        <use href="#i-branch"/>
                                    </svg>
                                    <span data-t="device.razvilka">Если на экране…</span>
                                </button>
                                <button class="sm ghost" onclick="recSideOpen()">
                                    <svg class="ic" aria-hidden="true">
                                        <use href="#i-shield"/>
                                    </svg>
                                    <span data-t="device.vsplyvayuschie_okna_i_pomehi">Если выскочило окно</span>
                                </button>
                                <button class="sm ghost" id="btnRecDiff" onclick="recDiff()" hidden
                                        title="Отличия от сохранённой версии" data-t-title="device.otlichiya_ot_sohranennoy_versii">
                                    <svg class="ic" aria-hidden="true">
                                        <use href="#i-diff"/>
                                    </svg>
                                    <span data-t="device.izmeneniya">Изменения</span>
                                </button>
                                <button class="sm ghost" id="btnRecCode" onclick="recPreview()"
                                        title="Показать код сценария" data-t-title="device.pokazat_kod_stsenariya">
                                    <svg class="ic" aria-hidden="true">
                                        <use href="#i-code"/>
                                    </svg>
                                    <span data-t="device.kod_stsenariya">Код сценария</span>
                                </button>
                                <hr>
                                <label class="kb"
                                       title="Паузы между действиями станут шагами «Подождать»" data-t-title="device.pauzy_mezhdu_deystviyami_stanut">
                                    <input type="checkbox" id="recPauses" onchange="REC.pauses=this.checked">
                                    <span data-t="device.pauzy">паузы</span>
                                </label>
                                <label class="kb"
                                       title="Ставить проверку экрана перед первым действием на каждом новом экране" data-t-title="device.avto_proverki_podskazka">
                                    <input type="checkbox" id="recAutoAnchor" onchange="recAutoAnchorSet(this.checked)">
                                    <span data-t="device.avto_proverki">сверять экран сам</span>
                                </label>
                            </div>
                        </details>

                        <!-- Масштаб холста: развилка на пять веток шире любой
                             панели, и без «вписать» её концы уходили за край. -->
                        <span class="recbar-sep" aria-hidden="true"></span>


                        <span class="sp"></span>

                        <!-- Вход в диалог устройства: запуск приложения,
                             ссылка, adb shell, дампы, «Починить». -->
                        <button class="sm ghost" onclick="devToolsOpen()"
                                title="Приложения, ссылки, починка, консоль" data-t="device.upravlenie" data-t-title="device.prilozheniya_ssylki_pochinka_konsol">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-sliders"/>
                            </svg>
                            Управление
                        </button>

                        <button class="sm ghost" id="btnMirror" onclick="mirrorToggle()"
                                aria-pressed="true"
                                title="Свернуть экран" data-t-title="device.svernut_ekran">
                            <svg class="ic" aria-hidden="true">
                                <use href="#i-panel"/>
                            </svg>
                            <span data-t="device.ekran">Экран</span>
                        </button>
                    </div>
                    <!-- Задача на этом устройстве стоит и ждёт решения: тот же
                         decisionBar, что на «Задачах» (jobs.js) — «открыть
                         устройство» иначе приводило сюда без единого слова о
                         том, что тут держат и почему. Пусто, когда не ждут. -->
                    <div id="deviceHeldBar"></div>
                    <div class="warn" id="recBanner" hidden></div>
                    <div class="runbar" id="recRun" hidden></div>
                </div>

                <div class="sch" id="recScheme" hidden>
                    <!-- Холст прокручивается и масштабируется сам, .sch-spine
                         несёт размер сюжета: панель вокруг него не ездит. -->
                        <div class="zoom zoom-float" id="recZoom">
                            <button class="sm ghost" onclick="grZoomBy(-1)" aria-label="Мельче" data-t-aria-label="device.melche">
                                <svg class="ic" aria-hidden="true">
                                    <use href="#i-zoom-out"/>

                            <span data-t="pult.syuda_ili_na_ekran"><b data-t="pult.peretaschite_apk_ili_fayl">Перетащите APK или файл</b> — сюда или на экран</span>

                        <svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg>Управление</button>

    <section class="view" id="view-jobs" aria-label="Запуски" data-t-aria-label="jobs.zapuski">

            <!-- «Задачи» и «Проблемы» — один вопрос «что с запусками»: один

            <div class="seg runs-seg" role="tablist" aria-label="Запуски" data-t-aria-label="jobs.zapuski">

                </svg>

            </button>
            <button class="sm danger" id="btnCancelAll" onclick="cancelAll(event)" data-t="jobs.ostanovit_vse_zapuski">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-x"/>
                </svg>
                Остановить все запуски
            </button>
        </div>
        <div class="batchbar" id="jobBatch" hidden></div>
        <div class="split">
            <div class="scroll" id="jobList"></div>
            <div class="logwrap">
                <!-- Живой экран задачи: пока прогон идёт (queued/running/held),
                     видно, что сейчас на устройстве, без похода на «Ферма» или
                     «открыть устройство». Кадр обновляется сам по себе — тот же
                     механизм, что у плиток на «Ферме», см. fleet.js:thumbArm. -->
                <div id="jobLive"></div>
                <!-- Полоса решения над журналом: остановленная задача держит

                <div id="jobHeld"></div>
                <div id="jobRepair"></div>
                <div id="jobSteps"></div>

    <!-- Отдельный раздел, а не фильтр по журналу задач: журнал отвечает

    <section class="view" id="view-deviations" aria-label="Проблемы запусков" data-t-aria-label="problems.problemy_zapuskov">

                        onclick="showView('jobs')" data-t="problems.vse_zapuski">Все запуски</button>

    <section class="view" id="view-schedule" aria-label="Расписание запусков" data-t-aria-label="schedule.raspisanie_zapuskov">

    </section>

    <!-- ========================================================= АККАУНТЫ -->
    <section class="view" id="view-accounts" aria-label="Аккаунты" data-t-aria-label="accounts.akkaunty">
        <div class="bar">
            <div class="find">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-search"/>
                </svg>
                <input type="text" id="accSearch" placeholder="логин, телефон, заметка"
                       aria-label="Поиск по аккаунтам" oninput="accFilter()" data-t-placeholder="accounts.login_telefon_zametka" data-t-aria-label="accounts.poisk_po_akkauntam">
            </div>
            <select id="accPlatform" class="sm" aria-label="Платформа" onchange="accFilter()" data-t-aria-label="accounts.platforma"></select>
            <span class="sect-n" id="accSummary"></span>
            <span class="sp"></span>
            <button class="sm" id="btnAccAutobind" onclick="accAutobind()"
                    title="Каждому телефону без аккаунта — свободный" data-t="accounts.razdat_telefonam" data-t-title="accounts.kazhdomu_telefonu_bez_akkaunta">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-phone"/>
                </svg>
                Раздать телефонам
            </button>
            <button class="sm" onclick="accImport()" data-t="accounts.vstavit_spiskom">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-copy"/>
                </svg>
                Вставить списком
            </button>
            <button class="sm primary" onclick="accAdd()" data-t="accounts.dobavit">
                <svg class="ic" aria-hidden="true">
                    <use href="#i-plus"/>
                </svg>
                Добавить
            </button>
        </div>
        <div class="scroll grow" id="accList"></div>
    </section>
<script>
    /* Раздел из адреса выбираем сразу, до первой отрисовки: app.js потом
       видит, что нужный раздел уже включён, и ничего не переключает, —
       ни подсветка вкладки, ни анимация появления не перезапускаются. */
    (function () {
        var name = location.hash.replace(/^#/, '').split('/')[0] || 'fleet';
        if (!document.getElementById('view-' + name)) name = 'fleet';
        document.getElementById('view-' + name).classList.add('on');
        var nav = (name === 'deviations' || name === 'schedule') ? 'jobs' : name;
        var btn = document.querySelector('.navbtn[data-view="' + nav + '"]');
        if (btn) { btn.classList.add('on'); btn.setAttribute('aria-current', 'page'); }
    })();
</script>
